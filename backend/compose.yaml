name: task-tracker

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        sh,
        -c,
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction',
      ]
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    logging: *logging

  postgres:
    image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d task_tracker']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    shm_size: 128mb
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 60s
    logging: *logging

  migrate:
    image: task-tracker-migrate:${IMAGE_TAG:-local}
    build:
      context: .
      target: migrate
    environment:
      MIGRATION_DATABASE_URL: postgresql://task_tracker_migrator:${POSTGRES_MIGRATION_PASSWORD:?Set POSTGRES_MIGRATION_PASSWORD in .env}@postgres:5432/task_tracker?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging: *logging

  api:
    image: task-tracker-api:${IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NOTIFICATION_WORKER_ENABLED: ${NOTIFICATION_WORKER_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:3001}
      PORT: '3001'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_TLS: 'false'
      DATABASE_URL: postgresql://task_tracker_app:${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD in .env}@postgres:5432/task_tracker
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_CONNECTION_TIMEOUT_MS: '5000'
      DATABASE_QUERY_TIMEOUT_MS: '5000'
      DATABASE_IDLE_TIMEOUT_MS: '30000'
    ports:
      - '127.0.0.1:${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s
    logging: *logging

volumes:
  postgres_data:
  redis_data:
